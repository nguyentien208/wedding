<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng Nhập Quản Trị — Thiệp Cưới Online</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- Admin Custom CSS -->
  <link rel="stylesheet" href="../assets/css/admin.css">
  
  <style>
    body.login-page {
      background: linear-gradient(135deg, #1E293B 0%, #0F172A 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .login-card {
      background: #FFFFFF;
      border-radius: 16px;
      padding: 40px 32px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3);
      text-align: center;
    }
    .login-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: 2rem;
      color: var(--admin-primary);
      margin-bottom: 8px;
    }
    .login-subtitle {
      font-size: 0.85rem;
      color: var(--admin-text-muted);
      margin-bottom: 28px;
    }
    .form-group {
      margin-bottom: 20px;
      text-align: left;
    }
    .form-label {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--admin-text-dark);
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .form-control {
      width: 100%;
      padding: 12px 16px;
      border: 1px solid var(--admin-border);
      border-radius: 8px;
      font-family: inherit;
      font-size: 0.9rem;
      background-color: #F8FAFC;
      transition: border-color 0.2s ease;
    }
    .form-control:focus {
      outline: none;
      border-color: var(--admin-primary);
      background-color: #FFFFFF;
    }
    .pwd-wrapper {
      position: relative;
    }
    .pwd-toggle {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--admin-text-muted);
      cursor: pointer;
    }
  </style>
</head>
<body class="login-page">

  <div class="login-card">
    <div style="font-size: 36px; color: var(--admin-primary); margin-bottom: 12px;">❤️</div>
    <h1 class="login-title">QUẢN TRỊ THIỆP CƯỚI</h1>
    <p class="login-subtitle">Đăng nhập tài khoản Admin để quản lý nội dung</p>

    <div id="alert-box" style="display: none; padding: 12px; border-radius: 8px; font-size: 0.85rem; margin-bottom: 20px; text-align: left;"></div>

    <form id="login-form">
      <div class="form-group">
        <label class="form-label" for="login-email">Email Admin</label>
        <input type="email" id="login-email" class="form-control" placeholder="admin@wedding.com" required>
      </div>

      <div class="form-group">
        <label class="form-label" for="login-password">Mật Khẩu</label>
        <div class="pwd-wrapper">
          <input type="password" id="login-password" class="form-control" placeholder="••••••••" required>
          <i id="pwd-toggle-icon" class="fas fa-eye pwd-toggle" onclick="togglePassword()"></i>
        </div>
      </div>

      <button type="submit" id="btn-login" class="btn-admin btn-admin-primary" style="width: 100%; justify-content: center; padding: 12px;">
        <i class="fas fa-sign-in-alt"></i> ĐĂNG NHẬP
      </button>
    </form>
  </div>

  <!-- Supabase CDN JS -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/supabase.js"></script>
  <script src="../assets/js/admin/auth.js"></script>

  <script>
    // Toggle ẩn/hiện mật khẩu
    function togglePassword() {
      const pwdInput = document.getElementById('login-password');
      const icon = document.getElementById('pwd-toggle-icon');
      if (pwdInput.type === 'password') {
        pwdInput.type = 'text';
        icon.className = 'fas fa-eye-slash pwd-toggle';
      } else {
        pwdInput.type = 'password';
        icon.className = 'fas fa-eye pwd-toggle';
      }
    }

    // Kiểm tra nếu đã login từ trước thì vào thẳng Admin
    document.addEventListener('DOMContentLoaded', async () => {
      const session = await AdminAuth.getSession();
      if (session) {
        window.location.href = 'index.html';
      }
    });

    // Form Submit Handler
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('login-email').value;
      const password = document.getElementById('login-password').value;
      const btn = document.getElementById('btn-login');
      const alertBox = document.getElementById('alert-box');

      alertBox.style.display = 'none';
      btn.disabled = true;
      btn.innerHTML = `<i class="fas fa-spinner fa-spin"></i> Đang đăng nhập...`;

      const result = await AdminAuth.login(email, password);

      btn.disabled = false;
      btn.innerHTML = `<i class="fas fa-sign-in-alt"></i> ĐĂNG NHẬP`;

      if (result.success) {
        alertBox.style.display = 'block';
        alertBox.style.background = '#D1FAE5';
        alertBox.style.color = '#065F46';
        alertBox.innerHTML = '✅ Đăng nhập thành công! Đang chuyển hướng...';
        setTimeout(() => {
          window.location.href = 'index.html';
        }, 1000);
      } else {
        alertBox.style.display = 'block';
        alertBox.style.background = '#FEE2E2';
        alertBox.style.color = '#991B1B';
        alertBox.innerHTML = `❌ Error: ${result.error.message || 'Sai email hoặc mật khẩu'}`;
      }
    });
  </script>
</body>
</html>
